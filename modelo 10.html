<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zintech - Calendário Industrial</title>
    <style>
        :root { --primary: #0056b3; --success: #28a745; --danger: #dc3545; --dark: #212529; --light: #f8f9fa; }
        body { font-family: 'Segoe UI', system-ui, sans-serif; margin: 0; padding: 15px; background-color: #eef2f7; color: var(--dark); }
        header { display: flex; justify-content: space-between; align-items: center; background: white; padding: 15px 20px; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        .status-online { color: var(--success); font-weight: bold; animation: pulse 2s infinite; }
        @keyframes pulse { 0% { opacity: 0.5; } 50% { opacity: 1; } 100% { opacity: 0.5; } }
        .grid-layout { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 20px; margin-top: 20px; }
        section { background: white; padding: 20px; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        .full-width { grid-column: 1 / -1; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { border: 1px solid #dee2e6; padding: 12px; text-align: left; }
        th { background-color: var(--light); font-weight: 600; }
        button { background-color: var(--primary); color: white; border: none; padding: 12px 18px; border-radius: 6px; cursor: pointer; font-weight: bold; width: 100%; margin-top: 5px; font-size: 16px; }
        button:hover { background-color: #004085; }
        input, select { width: 100%; padding: 12px; border: 1px solid #ced4da; border-radius: 6px; box-sizing: border-box; font-size: 16px; margin-top: 4px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; font-weight: 500; }
        /* Esconde o formulário por padrão para não ocupar espaço na TV da fábrica */
        #secao-formulario { display: none; border: 2px solid var(--primary); }
    </style>
</head>
<body>

    <header>
        <h1 style="margin:0; font-size: 24px;">🏭 ZINTECH — Calendário</h1>
        <div><span class="status-online">● Painel Geral Online</span></div>
    </header>

    <!-- Botão utilitário para quem acessa pelo celular -->
    <div style="margin-top: 15px;">
        <button id="btn-toggle-form" style="background-color: #6c757d;">📱 Abrir Formulário (Apenas no Celular)</button>
    </div>

    <div class="grid-layout">
        <!-- FORMULÁRIO DE ATUALIZAÇÃO -->
        <section id="secao-formulario" class="full-width">
            <h2>➕ Nova Ordem de Produção</h2>
            <form id="form-ordem">
                <div class="form-group"><label>Cliente</label><input type="text" id="ordem-cliente" required></div>
                <div class="form-group"><label>Tipo de Peça</label><input type="text" id="ordem-peca" required></div>
                <div class="form-group"><label>Quantidade (kg)</label><input type="number" id="ordem-qtd" required></div>
                <div class="form-group"><label>Data de Entrega</label><input type="date" id="ordem-entrega" required></div>
                <div class="form-group">
                    <label>Status</label>
                    <select id="ordem-status">
                        <option value="Em andamento">Em andamento</option>
                        <option value="Prioridade / Atrasado">🚨 Prioridade / Atrasado</option>
                    </select>
                </div>
                <button type="submit" style="background-color: var(--success);">Lançar no Painel da Fábrica</button>
            </form>
        </section>

        <!-- TABELA 1: PRODUÇÃO ATIVA (Visível na Fábrica) -->
        <section class="full-width">
            <h2>🏭 Produção em Andamento</h2>
            <div style="overflow-x: auto;">
                <table>
                    <thead>
                        <tr>
                            <th>Cliente / Peça</th>
                            <th>Qtd (kg)</th>
                            <th>Entrega</th>
                            <th>Status</th>
                        </tr>
                    </thead>
                    <tbody id="tabela-producao-andamento">
                        <tr><td colspan="4">A carregar dados do Firebase...</td></tr>
                    </tbody>
                </table>
            </div>
        </section>

        <!-- TABELA 2: TAREFAS DO DIA -->
        <section class="full-width">
            <h2>📋 Todas as Tarefas Cadastradas</h2>
            <div style="overflow-x: auto;">
                <table>
                    <thead>
                        <tr>
                            <th>Data</th>
                            <th>Tarefa</th>
                            <th>Status</th>
                        </tr>
                    </thead>
                    <tbody id="tabela-todas-tarefas">
                        <tr><td colspan="3">A carregar tarefas...</td></tr>
                    </tbody>
                </table>
            </div>
        </section>
    </div>

    <!-- Script de Sincronização em Tempo Real -->
    <script type="module">
        import { initializeApp } from "https://gstatic.com";
        import { getDatabase, ref, push, onValue } from "https://gstatic.com";

        const firebaseConfig = {
            apiKey: "AIzaSyCXit1kRnn3TfEjCEEbyUsgtBA21ntJxXs",
            authDomain: "://firebaseapp.com",
            databaseURL: "https://firebaseio.com",
            projectId: "calendario-zintech",
            storageBucket: "calendario-zintech.firebasestorage.app",
            messagingSenderId: "374446044072",
            appId: "1:374446044072:web:391437ee00138a9ebe639d"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        // Lógica do Botão para exibir/esconder o formulário no celular
        const btnToggle = document.getElementById("btn-toggle-form");
        const secaoForm = document.getElementById("secao-formulario");
        btnToggle.addEventListener("click", () => {
            if (secaoForm.style.display === "block") {
                secaoForm.style.display = "none";
                btnToggle.innerText = "📱 Abrir Formulário (Apenas no Celular)";
            } else {
                secaoForm.style.display = "block";
                btnToggle.innerText = "✕ Fechar Formulário";
            }
        });

        // RECARREGAMENTO AUTOMÁTICO DE SEGURANÇA: Atualiza a página inteira a cada 5 minutos (300000ms)
        // Isso resolve em definitivo se a TV perder o sinal do Wi-Fi temporariamente
        setTimeout(() => {
            window.location.reload();
        }, 300000);

        // Ler Ordens em Tempo Real
        onValue(ref(db, "ordens_producao"), (snapshot) => {
            const dados = snapshot.val();
            const tabelaAndamento = document.getElementById("tabela-producao-andamento");
            tabelaAndamento.innerHTML = "";

            if (dados) {
                Object.keys(dados).forEach((id) => {
                    const o = dados[id];
                    const corStatus = o.status === "Em andamento" ? "green" : "red";
                    tabelaAndamento.innerHTML += `
                        <tr>
                            <td><strong>${o.cliente || ""}</strong><br><small>${o.tipo_peca || ""}</small></td>
                            <td>${o.quantidade_kg || 0} kg</td>
                            <td>${o.data_entrega || ""}</td>
                            <td style="color: ${corStatus}; font-weight:bold;">${o.status || ""}</td>
                        </tr>
                    `;
                });
            } else {
                tabelaAndamento.innerHTML = "<tr><td colspan='4'>Nenhuma ordem ativa no momento.</td></tr>";
            }
        });

        // Ler Tarefas em Tempo Real
        onValue(ref(db, "tarefas"), (snapshot) => {
            const dados = snapshot.val();
            const tabelaTarefas = document.getElementById("tabela-todas-tarefas");
            tabelaTarefas.innerHTML = "";

            if (dados) {
                Object.keys(dados).forEach((id) => {
                    const t = dados[id];
                    tabelaTarefas.innerHTML += `
                        <tr>
                            <td>${t.data || ""}</td>
                            <td>${t.nome_tarefa || ""}</td>
                            <td><span style="background:#fff3cd; padding:3px 8px; border-radius:4px;">${t.status || ""}</span></td>
                        </tr>
                    `;
                });
            } else {
                tabelaTarefas.innerHTML = "<tr><td colspan='3'>Nenhuma tarefa registrada.</td></tr>";
            }
        });

        // Gravar via Celular/Navegador (CORRIGIDO)
        const formOrdem = document.getElementById("form-ordem");
        formOrdem.addEventListener("submit", (e) => {
            e.preventDefault();
            
            const novaOrdem = {
                cliente: document.getElementById("ordem-cliente").value,
                tipo_peca: document.getElementById("ordem-peca").value,
                quantidade_kg: parseFloat(document.getElementById("ordem-qtd").value) || 0,
                data_chegada: new Date().toISOString().split('T')[0],
                data_entrega: document.getElementById("ordem-entrega").value,
                status: document.getElementById("ordem-status").value
            };

            push(ref(db, "ordens_producao"), novaOrdem)
                .then(() => {
                    alert("Painel Atualizado com Sucesso!");
                    formOrdem.reset(); // Comando corrigido para não travar o celular
                    secaoForm.style.display = "none"; // Fecha o formulário no celular após enviar
